<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout & Payment</title>
</head>
<body>
    <h1>Checkout</h1>
    <p>Complete your purchase below:</p>

    <form id="checkout-form">
        <div>
            <label for="card-number">Card Number:</label>
            <input type="text" id="card-number" name="card-number" placeholder="4111..." />
        </div>
        <div>
            <label for="password">Account Password:</label>
            <input type="password" id="password" name="password" />
        </div>
        <div>
            <button type="button" id="pay-now-btn">Pay now</button>
            <button type="button" id="upgrade-pay-btn">Upgrade and Pay now</button>
        </div>
    </form>
</body>
</html>
