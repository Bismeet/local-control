[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-control"
version = "0.1.0"
description = "A local-first Personal Computer Agent for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "local-control contributors" }
]
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.0.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "mss>=10.2.0",
    "pillow>=11.0.0",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "pywin32>=311; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]

[project.scripts]
local-control = "local_control.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/local_control"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "local_control.core.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "win32gui",
    "win32process",
    "win32security",
    "win32api",
    "win32con",
    "psutil",
    "mss",
    "mss.*",
    "pywinauto",
    "pywinauto.*",
    "pyautogui",
    "pyautogui.*",
    "pynput",
    "pynput.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Pure logic unit tests without external dependencies",
    "integration: Integration tests with fake providers and simulated environments",
    "desktop: Interactive Windows desktop tests requiring an active session",
    "browser: Playwright browser automation tests",
    "e2e: End-to-end task scenarios with vision models",
]
addopts = "-ra -q -m 'not desktop and not browser and not e2e'"
